name: MVP CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/academic_recovery_concurrency_test_${{ github.run_id }}_${{ github.run_attempt }}
        run: npm run validate

      - name: Smoke infrastructure adapters
        env:
          MONGODB_URI: mongodb://localhost:27017/akademik_takvim_ci
          REDIS_URL: redis://localhost:6379
        run: npm run smoke:infra

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
