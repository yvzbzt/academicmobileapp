substitutions:
  _IMAGE: europe-west1-docker.pkg.dev/$PROJECT_ID/academic-calendar/academic-calendar-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/Dockerfile.api
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

images:
  - ${_IMAGE}
