name: anssoft-backend

services:
  mongodb:
    image: mongo:8.0
    container_name: anssoft-mongodb
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.5"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:?MONGO_APP_DATABASE is required}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:?MONGO_APP_DATABASE is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongo-init.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_APP_USERNAME}"
          --password "$${MONGO_APP_PASSWORD}"
          --authenticationDatabase "$${MONGO_APP_DATABASE}"
          --eval "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)"
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    cpus: "1.50"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    build:
      context: ./source
      dockerfile: deploy/hetzner/Dockerfile.api
    image: anssoft-backend:2026-07-17
    container_name: anssoft-backend
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Europe/Istanbul
      QUEUE_MODE: memory
      RATE_LIMIT_STORE: memory
      TRUSTED_PROXY_CIDRS: 172.30.79.0/24
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@anssoft-mongodb:27017/${MONGO_APP_DATABASE}?authSource=${MONGO_APP_DATABASE}
      MONGODB_SELECTION_TIMEOUT_MS: "5000"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      EMAIL_VERIFICATION_TOKEN_PEPPER: ${EMAIL_VERIFICATION_TOKEN_PEPPER:?EMAIL_VERIFICATION_TOKEN_PEPPER is required}
      PASSWORD_RECOVERY_TOKEN_PEPPER: ${PASSWORD_RECOVERY_TOKEN_PEPPER:?PASSWORD_RECOVERY_TOKEN_PEPPER is required}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:?DATA_ENCRYPTION_KEY_ID is required}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      DATA_LOOKUP_HMAC_SECRET: ${DATA_LOOKUP_HMAC_SECRET:?DATA_LOOKUP_HMAC_SECRET is required}
      DATA_ENCRYPTION_PREVIOUS_KEYS: ${DATA_ENCRYPTION_PREVIOUS_KEYS:-}
      CALENDAR_FEED_SECRET: ${CALENDAR_FEED_SECRET:?CALENDAR_FEED_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-https://academic-api.anssoft.com.tr}
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-https://academic-api.anssoft.com.tr/auth/verify-email}
      MAIL_FROM: ${MAIL_FROM:-noreply@anssoft.com.tr}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      APPLE_SIGN_IN_CLIENT_IDS: ${APPLE_SIGN_IN_CLIENT_IDS:?APPLE_SIGN_IN_CLIENT_IDS is required}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-academic-mobile-app-7629}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      AUTH_EXPOSE_PREVIEW_VERIFICATION_TOKEN: "false"
      BOOTSTRAP_CATALOG_SEED_ENABLED: "true"
      BOOTSTRAP_CATALOG_SEED_TIMEOUT_MS: "20000"
      BOOTSTRAP_SEED_ENABLED: "false"
      ANNOUNCEMENT_AUTO_INGEST_ENABLED: "false"
      CALENDAR_AUTO_INGEST_ENABLED: "false"
    expose:
      - "3000"
    volumes:
      - ./secrets:/run/secrets:ro
    networks:
      internal: {}
      egress:
        gw_priority: 1
      proxy:
        aliases:
          - academic-api
        gw_priority: -1
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/ready')
          .then(async response => {
            const body = await response.json();
            if (!response.ok || body.status !== 'ok') process.exit(1);
          })
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    mem_limit: 1g
    cpus: "1.50"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  content-worker:
    image: anssoft-backend:2026-07-17
    container_name: anssoft-content-worker
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - node
      - dist/apps/api/src/main.content-worker.js
    environment:
      NODE_ENV: production
      TZ: Europe/Istanbul
      CONTENT_INGESTION_WORKER_ENABLED: "true"
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@anssoft-mongodb:27017/${MONGO_APP_DATABASE}?authSource=${MONGO_APP_DATABASE}
      MONGODB_SELECTION_TIMEOUT_MS: "5000"
      ANNOUNCEMENT_AUTO_INGEST_ENABLED: ${ANNOUNCEMENT_AUTO_INGEST_ENABLED:-false}
      ANNOUNCEMENT_HEALTH_PROBE_ENABLED: ${ANNOUNCEMENT_HEALTH_PROBE_ENABLED:-true}
      ANNOUNCEMENT_DEVICE_REVISION_ENABLED: ${ANNOUNCEMENT_DEVICE_REVISION_ENABLED:-true}
      ANNOUNCEMENT_INGEST_BATCH_SIZE: ${ANNOUNCEMENT_INGEST_BATCH_SIZE:-50}
      ANNOUNCEMENT_INGEST_CONCURRENCY: ${ANNOUNCEMENT_INGEST_CONCURRENCY:-4}
      CALENDAR_AUTO_INGEST_ENABLED: ${CALENDAR_AUTO_INGEST_ENABLED:-false}
      OCR_PROVIDER: ${OCR_PROVIDER:-}
      GOOGLE_DOCUMENT_AI_PROCESSOR_NAME: ${GOOGLE_DOCUMENT_AI_PROCESSOR_NAME:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - ./secrets:/run/secrets:ro
    networks:
      internal: {}
      egress:
        gw_priority: 1
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: "1.00"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  internal:
    name: anssoft-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.77.0/24
  egress:
    name: anssoft-egress
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.78.0/24
  proxy:
    name: anssoft-academic-edge
    external: true

volumes:
  mongodb_data:
    name: anssoft-mongodb-data
  mongodb_config:
    name: anssoft-mongodb-config
