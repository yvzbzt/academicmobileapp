name: anssoft-academic-admin

services:
  admin:
    image: caddy:2-alpine
    container_name: anssoft-academic-admin
    restart: unless-stopped
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    expose:
      - "8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv:ro
    networks:
      proxy:
        aliases:
          - academic-admin
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,size=8m
      - /data:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

networks:
  proxy:
    name: anssoft-academic-edge
    external: true
